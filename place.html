<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inspection report | Springfield Food Inspections</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Public+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main id="main" class="wrap">
  <div class="place-head">
    <p class="no-print"><a href="index.html">Back to search</a></p>
    <h1 id="name">Loading…</h1>
    <p class="addr" id="addr"></p>
  </div>
  <div id="content"></div>
</main>
<script src="assets/items.js"></script>
<script src="assets/app.js"></script>
<script>
(async function () {
  const S = window.SFI;
  await S.page("");
  const params = new URLSearchParams(location.search);
  const estNo = params.get("id");
  const $ = (id) => document.getElementById(id);
  let est = null, current = null;

  const VISIT_NOUN = { "Routine": "a routine inspection", "Follow-up": "a follow-up inspection", "Complaint": "an inspection after a complaint",
    "Spot check": "a spot check", "Educational": "an educational visit", "Routine + complaint": "a routine inspection that also looked into a complaint",
    "Routine + follow-up": "a routine inspection that was also a follow-up" };
  const visitNoun = (v) => VISIT_NOUN[v.visit] || "an inspection";

  function visitSentence(v, withName, noDate) {
    const who = withName ? est.name : "this place";
    const noun = visitNoun(v);
    const lead = noDate ? `${noun[0].toUpperCase() + noun.slice(1)}.` : `${S.date(v.date)}: ${noun} at ${who}.`;
    if (v.older) {
      if (!v.fetched) return `${lead} This report is from before 2019. Its violations haven't been loaded yet.`;
      return `${lead} ` + (v.findings.length ? `The inspector found ${S.plural(v.findings.length, "violation")}.` : "No violations were found.");
    }
    if (v.risk === null) return `${lead} The number of violations isn't available for this one.`;
    if (v.risk + v.grp === 0) return `${lead} No violations were found.`;
    let s = `${lead} The inspector found ${S.plural(v.risk, "risk factor violation")} and ${S.plural(v.grp, "upkeep violation")}.`;
    if (v.repeat) s += v.repeat === 1 ? " One was a repeat from an earlier inspection." : ` ${v.repeat} were repeats from earlier inspections.`;
    return s;
  }

  function findingHTML(f) {
    const it = itemInfo(f.item, f.title);
    const isRisk = it.kind === "risk";
    const rep = f.repeat || f.mentions_repeat;
    return `<article class="finding ${it.kind}" aria-label="Item ${S.esc(f.item)}: ${S.esc(it.short)}">
      <div class="num" aria-hidden="true">${S.esc(f.item ?? "?")}</div>
      <div class="body">
        <div class="chips">
          <span class="chip ${it.kind}">${isRisk ? "Risk factor" : (it.tag || "Upkeep")}</span>
          ${rep ? `<span class="chip rep">Repeat</span>` : ""}
          <span class="muted" style="font-size:.85rem">Item ${S.esc(f.item)}: ${S.esc(it.short)}</span>
        </div>
        <p class="plain"><mark>${S.esc(it.plain)}</mark></p>
        ${it.why ? `<p class="why"><b>Why it matters:</b> ${S.esc(it.why)}</p>` : ""}
        ${f.comment ? `<details><summary>Inspector's notes</summary><div class="verbatim">${S.esc(f.comment)}</div></details>` : ""}
        ${f.citation ? `<details><summary>Food Code ${S.esc(f.citation)}</summary><p class="cite">${S.esc(f.citation_text)}</p></details>` : ""}
      </div>
    </article>`;
  }

  function olderHTML(f) {
    return `<article class="finding older" aria-label="${S.esc(f.title)}">
      <div class="num" aria-hidden="true">${f.item == null ? "&ndash;" : S.esc(f.item)}</div>
      <div class="body">
        <div class="chips"><span class="chip older">Older form${f.item == null ? "" : ", item " + S.esc(f.item)}</span>${f.repeat || f.mentions_repeat ? `<span class="chip rep">Repeat</span>` : ""}</div>
        <p class="title">${S.esc(f.title)}</p>
        ${f.comment ? `<p class="muted" style="margin:.2rem 0">Inspector's notes:</p><div class="verbatim">${S.esc(f.comment)}</div>` : ""}
        ${f.citation ? `<details><summary>Code rule ${S.esc(f.citation)}</summary><p class="cite">${S.esc(f.citation_text)}</p></details>` : ""}
      </div>
    </article>`;
  }

  function showVisit(id, push) {
    const v = est.visits.find((x) => x.id === id) || est.visits[0];
    current = v;
    document.querySelectorAll(".timeline button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.id === v.id ? "true" : "false"));
    const fs = [...v.findings].sort((a, b) => (a.item ?? 99) - (b.item ?? 99));
    const risk = fs.filter((f) => (f.item ?? 99) <= 29), up = fs.filter((f) => (f.item ?? 99) > 29);
    let body;
    if (!v.fetched) body = `<p class="muted">We haven't loaded the violations for this inspection yet. <a href="${S.esc(v.detail_url)}">See them on the county website</a></p>`;
    else if (!fs.length && (v.risk || v.grp)) body = `<p class="muted">The violations for this inspection aren't available here. <a href="${S.esc(v.detail_url)}">See them on the county website</a></p>`;
    else if (!fs.length) body = "";
    else if (v.older) body = `<h3>Violations (${fs.length})</h3><p class="muted">Before 2019 the county used a different inspection form with different numbers, so these are shown the way the inspector wrote them.</p>${fs.map(olderHTML).join("")}`;
    else body = (risk.length ? `<h3>Risk factor violations (${risk.length})</h3><p class="muted">These are the most likely to cause foodborne illness.</p>${risk.map(findingHTML).join("")}` : "")
      + (up.length ? `<h3>Upkeep violations (${up.length})</h3><p class="muted">Cleaning, repairs and staff training.</p>${up.map(findingHTML).join("")}` : "");
    $("visit").innerHTML = `
      <h2 id="visitTitle" tabindex="-1">${S.date(v.date)} ${S.labelHTML(v.label)}</h2>
      <p>${S.esc(visitSentence(v, false, true))}</p>
      ${v.visit.toLowerCase() !== (v.type_raw || "").toLowerCase() ? `<p class="muted">The county lists this as "${S.esc(v.type_raw)}".</p>` : ""}
      ${body}
      <p><a href="${S.esc(v.detail_url)}">View the official report on the county website</a></p>`;
    if (push) history.replaceState(null, "", S.placeHref(est.est_no, v.id));
  }

  function summaryText() {
    const v = current;
    const lines = [`${est.name}, ${est.address}, ${est.city} ${est.zip}`, visitSentence(v, true)];
    for (const f of [...v.findings].sort((a, b) => a.item - b.item)) {
      if (v.older) { lines.push(`- ${f.title}${f.comment ? ": " + f.comment.replace(/\s+/g, " ").slice(0, 200) : ""}`); continue; }
      const it = itemInfo(f.item, f.title);
      lines.push(`- ${it.short} (${it.kind === "risk" ? "risk factor" : "upkeep"}${f.repeat ? ", repeat" : ""}): ${it.plain}`);
    }
    lines.push("This shows conditions at the time of the inspection. Problems may have been fixed since.", `Official report: ${v.detail_url}`, `Explained: ${location.href}`);
    return lines.join("\n");
  }

  async function load(fresh) {
    if (!estNo) { $("name").textContent = "No place selected"; $("content").innerHTML = `<p><a href="index.html">Search for a place</a>.</p>`; return; }
    try { est = await S.getJSON(`data/site/est/${S.slug(estNo)}.json`, fresh); }
    catch (e) { $("name").textContent = "Place not found"; $("content").innerHTML = `<p>We couldn't find that place. <a href="index.html">Search again</a></p>`; return; }
    document.title = `${est.name}: inspection reports | Springfield Food Inspections`;
    $("name").textContent = est.name;
    $("addr").textContent = `${est.address}, ${est.city}, ${est.state} ${est.zip}. ${est.est_type}. County ID ${est.est_no}.`;
    const latest = est.visits[0];
    const complaint = (S.meta && S.meta.complaint_url) || "https://sangamonil.gov/departments/m-r/public-health/food-service";
    $("content").innerHTML = `
      <section class="summary" aria-labelledby="latestTitle">
        <h2 id="latestTitle" style="margin-top:0">Most recent inspection ${S.labelHTML(latest.label)}</h2>
        <p>${S.esc(visitSentence(latest))}</p>
        <p class="muted">${S.daysAgo(latest.date) > 730 ? `This inspection was over ${Math.floor(S.daysAgo(latest.date) / 365)} years ago. ` : S.daysAgo(latest.date) > 60 ? `This inspection was ${Math.floor(S.daysAgo(latest.date) / 30)} months ago. ` : ""}It shows what the inspector saw that day. Problems may have been fixed since.</p>
      </section>
      <div class="tools no-print">
        <button type="button" id="copy">Copy summary</button>
        <button type="button" onclick="window.print()">Print</button>
        <a class="btn" href="${S.esc(complaint)}">Report a problem to SCDPH</a>
        <span aria-live="polite" id="copyMsg" class="muted"></span>
      </div>
      <h2>Inspection history</h2>
      <p class="muted">${est.visits.length === 1 ? "1 inspection." : `${est.visits.length} inspections, newest first. Tap one to see it.`}</p>
      <ul class="timeline">${est.visits.map((v) => `<li><button type="button" data-id="${v.id}" aria-pressed="false"><b>${S.date(v.date)}</b>${S.esc(v.visit)}<br>${S.esc(v.label)}</button></li>`).join("")}</ul>
      <section id="visit" aria-live="polite"></section>
      <p class="snapshot">Sangamon County doesn't grade restaurants or give pass/fail results. An inspection is a check of conditions at one point in time, and many violations are corrected while the inspector is there. The county website is the official record.</p>`;
    document.querySelectorAll(".timeline button").forEach((b) => (b.onclick = () => { showVisit(b.dataset.id, true); $("visitTitle").focus?.(); }));
    $("copy").onclick = async () => {
      try { await navigator.clipboard.writeText(summaryText()); $("copyMsg").textContent = "Copied."; }
      catch (e) { $("copyMsg").textContent = "Couldn't copy in this browser. Try selecting the text instead."; }
    };
    showVisit(params.get("visit") || latest.id, false);
  }
  document.addEventListener("sfi:refresh", () => load(true));
  load();
})();
</script>
</body>
</html>
