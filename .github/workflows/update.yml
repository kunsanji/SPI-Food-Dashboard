name: Update inspection data

on:
  schedule:
    # GitHub schedules run on UTC. 08:17 UTC is about 2 AM Central in winter (3 AM in summer).
    # An odd minute avoids the top-of-hour rush, when GitHub delays scheduled runs by hours.
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal = last 14 days plus any unfinished backfill; recent-only = last 14 days only"
        type: choice
        options: [normal, recent-only]
        default: normal

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: helper/requirements.txt

      - run: pip install -r helper/requirements.txt

      - name: Run helper
        id: helper
        run: |
          if [ "${{ github.event.inputs.mode }}" = "recent-only" ]; then
            python helper/scrape.py --recent-only
          else
            python helper/scrape.py
          fi

      - name: Save data back to the repo
        if: always()
        run: |
          git config user.name "inspection-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
            # someone may have edited the site while this ran; data/ is only written here
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 10
            done
          fi

      - name: Package site
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
